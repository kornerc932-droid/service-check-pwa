<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Service Check – v2.9 (FULL)</title>
  <style>
    :root { --bg:#f5f7fa; --fg:#1f2a34; --muted:#6b7b8c; --accent:#2f6ea5; --card:#ffffff; --line:#d9e0e7; --ok:#1b8e3e; --warn:#c0392b; --nv:#707b86; }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,'Helvetica Neue',Arial,sans-serif;}
    header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;align-items:center;justify-content:space-between}
    h1{font-size:18px;margin:0;}
    .title{display:flex;align-items:center;gap:8px}
    .title small{color:var(--muted);font-weight:500}
    .container{padding:16px;max-width:980px;margin:0 auto;padding-bottom:140px;}
    .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .input{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
    .input label{font-size:12px;color:var(--muted)}
    .req label::after{content:" *";color:#c0392b}
    .input input, .input textarea, .input select{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#fff;color:#111;font-size:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
    .tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
    .tile:hover{outline:2px solid var(--accent);}
    button.primary{background:var(--accent);border:none;color:#fff;border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px}
    button.ghost{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:16px}
    button.icon{padding:8px 10px}
    button[disabled]{opacity:0.5;cursor:not-allowed}
    .note{font-size:12px;color:var(--muted)}
    .pill{border:1px solid var(--line);border-radius:999px;padding:6px 10px;background:var(--card);font-size:12px}
    .badge{display:flex;gap:8px;flex-wrap:wrap}
    .chip{appearance:none;border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:999px;font-size:16px;cursor:pointer;user-select:none}
    .chip.active{box-shadow:0 0 0 2px rgba(47,110,165,.15);}
    .chip.ok.active{background:#eaf7ee;border-color:#1b8e3e;color:#1b8e3e}
    .chip.nok.active{background:#fdecea;border-color:#c0392b;color:#c0392b}
    .chip.nv.active{background:#eef2f6;border-color:#707b86;color:#707b86}
    .statusTag{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;margin-left:8px;font-size:12px;color:#333;vertical-align:middle}
    .status-ok{border-color:#1b8e3e;color:#1b8e3e;background:#eaf7ee}
    .status-nok{border-color:#c0392b;color:#c0392b;background:#fdecea}
    .status-nv{border-color:#707b86;color:#707b86;background:#eef2f6}
    .sig-pad{border:1px dashed var(--line); border-radius:8px; padding:8px; position:relative;}
    .sig-canvas{width:100%; height:160px; background:#fff; border:1px solid var(--line); border-radius:6px; touch-action: none;}
    .sig-tools{display:flex; gap:8px; margin-top:6px;}
    .sig-header{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .sig-right{display:flex;align-items:center;gap:8px}
    .sig-toggle{font-size:12px;color:#6b7b8c;cursor:pointer;user-select:none}
    .sig-disabled .sig-canvas{pointer-events:none; filter:grayscale(1); opacity:.6}
    .sig-disabled .sig-tools button{pointer-events:none; opacity:.5}
    .sig-badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;color:#6b7b8c}
    .table{width:100%;border-collapse:collapse}
    .table th,.table td{border:1px solid var(--line);padding:8px;text-align:left;font-size:13px}
    .table th{background:#f3f6fa}
    .footer-actions{position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;z-index:15}
    .toggle{margin-left:8px; font-size:12px; color:#6b7b8c; cursor:pointer; user-select:none}
    .inactive{opacity:.5}
    .photo-block img{max-width:120px;border:1px solid var(--line);border-radius:6px;margin-top:6px;display:none}
    .photo-block.has-photo img{display:block}
    @media (max-width: 420px){
      .row{flex-direction:column}
      .input{min-width:unset}
      .container{padding:10px; padding-bottom:160px;}
    }
    @media print{
      header, .footer-actions, .toggle, .chip, input[type="file"], .sig-toggle, .sig-badge, .startOnly, .authOnly, .homeOnly, .specsOnly, .projectsOnly, .bookOnly { display:none !important; }
      body{background:#fff;color:#000}
      .container{max-width:none;margin:0;padding:0}
      .card{break-inside:avoid;border:1px solid #999}
      .input input, .input textarea, .input select{border:1px solid #999}
      .photo-block:not(.has-photo){ display:none !important; } /* Fotos ohne Inhalt ausblenden */
      .inactive{ display:none !important; } /* inaktive Prüfpunkte nicht drucken */
      .sig-pad{border:1px solid #000} /* Signaturfelder immer sichtbar */
      @page { size: A4 portrait; margin: 12mm; }
    }
    .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.4);z-index:1000}
    .modal.open{display:flex}
    .modal-card{background:#ffffff;border:1px solid #d9e0e7;border-radius:12px;max-width:720px;width:92%;padding:12px}
    .modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
  </style>
</head>
<body>
  <header>
    <div class="title">
      <button class="ghost icon" id="backBtn" title="Zurück">⬅️</button>
      <h1 id="appTitle">Service Check</h1>
      <small id="subtitle"></small>
    </div>
    <div class="toolbar">
      <button class="ghost icon" id="settingsBtn" title="Einstellungen">⚙️</button>
    </div>
  </header>

  <main class="container" id="content"></main>

  <div class="modal" id="settingsModal" aria-hidden="true">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:6px 0 12px 0;font-size:16px;">Einstellungen</h2>
        <button class="ghost icon" id="closeSettings">✖️</button>
      </div>
      <div class="row">
        <div class="input"><label>Buchhaltung-PIN (4-stellig)</label><input id="accPin" placeholder="****" inputmode="numeric" maxlength="4"></div>
        <div style="display:flex;align-items:flex-end;gap:8px">
          <button class="ghost" id="saveAccPin">PIN setzen/ändern</button>
        </div>
      </div>
      <div class="row">
        <button class="ghost" id="btnLogin">Anmelden</button>
        <button class="ghost" id="btnLogout">Abmelden</button>
      </div>
      <div class="modal-actions">
        <button class="ghost" id="settingsSave">Schließen</button>
      </div>
    </div>
  </div>

  <div class="modal" id="saveInModal" aria-hidden="true">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:6px 0 12px 0;font-size:16px;">Protokoll speichern in…</h2>
        <button class="ghost icon" id="closeSaveIn">✖️</button>
      </div>
      <div id="saveInBody"></div>
      <div class="modal-actions">
        <button class="ghost" id="saveInCancel">Abbrechen</button>
        <button class="primary" id="saveInConfirm">Speichern</button>
      </div>
    </div>
  </div>

  <div class="modal" id="leaveModal" aria-hidden="true">
    <div class="modal-card">
      <h2 style="margin:6px 0 12px 0;font-size:16px;">Entwurf speichern?</h2>
      <div class="note">Du verlässt ein begonnenes Protokoll.</div>
      <div class="modal-actions">
        <button class="ghost" id="leaveNo">Nein</button>
        <button class="primary" id="leaveYes">Ja</button>
      </div>
    </div>
  </div>

  <div class="modal" id="accModal" aria-hidden="true">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h2 style="margin:6px 0 12px 0;font-size:16px;">Buchhaltung entsperren</h2>
        <button class="ghost icon" id="closeAcc">✖️</button>
      </div>
      <div class="row">
        <div class="input"><label>PIN (4-stellig)</label><input id="accLoginPin" placeholder="****" inputmode="numeric" maxlength="4"></div>
      </div>
      <div class="modal-actions">
        <button class="ghost" id="accCancel">Abbrechen</button>
        <button class="primary" id="accUnlock">Entsperren</button>
      </div>
      <div class="note">Die PIN wird lokal gespeichert.</div>
    </div>
  </div>

<script>
  const REQUIRED_HEADER_KEYS = ['projektnummer','projekt','betreiber','datum'];
  const HEADER_FIELDS_MIN = [
    {key:'projektnummer',label:'Projektnummer',req:true},
    {key:'projekt',label:'Projekt',req:true},
    {key:'betreiber',label:'Betreiber',req:true},
    {key:'datum',label:'Datum (TT/MM/JJJJ)',req:true},
    {key:'baujahr',label:'Baujahr'},
    {key:'jobType',label:'Auftragsart',req:false}
  ];

  const PROTOCOL_SECTIONS_RBG = [
    { id:'gasse', title:'Gasse / Ausrüstung', items:[
      {id:'schleifleitung', label:'Schleifleitung / Stromabnehmer', fields:[{type:'status'},{type:'note'}]},
      {id:'fahrschiene', label:'Fahrschiene (Befestigung/Tragbild)', fields:[{type:'status'},{type:'note'}]},
      {id:'oberfuehrung', label:'Obere Führungsschiene (Befestigung, Verbindungen)', fields:[{type:'status'},{type:'note'}]},
      {id:'schiene_bef', label:'Schienenstoß / Verbinder (Befestigung)', fields:[{type:'status'},{type:'note'}]},
      {id:'puffer', label:'Puffer / Festanschläge (Befestigung)', fields:[{type:'status'},{type:'note'}]},
      {id:'anschlaege', label:'Anschläge / Notanschläge', fields:[{type:'status'},{type:'note'}]},
      {id:'leitern', label:'Steigleitern / Podeste / Geländer', fields:[{type:'status'},{type:'note'}]},
      {id:'kennzeichnung', label:'Kennzeichnungen / Warnhinweise', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'fahrwagen', title:'Fahrwagen / Führungsrollen / Laufräder', items:[
      {id:'fw_befestigung', label:'Fahrwerk – Befestigung', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_motor', label:'Fahrwerk – Motor', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_getriebe', label:'Fahrwerk – Getriebe', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_drehmomentstuetze', label:'Fahrwerk – Drehmomentstütze', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_kupplung', label:'Fahrwerk – Kupplung', fields:[{type:'status'},{type:'note'}]},
      {id:'fuehrungsrollen_fahrwagen', label:'Führungsrollen Fahrwagen', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'lr_angetrieben', label:'Laufrad angetrieben', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'note'}]},
      {id:'lr_nichtangetrieben', label:'Laufrad nicht angetrieben', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'note'}]},
      {id:'achsabdeckung', label:'Abdeckungen / Schutz', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'hubwerk', title:'Hubwerk', items:[
      {id:'befestigungen_allg', label:'Befestigungen (allg.)', fields:[{type:'status'},{type:'note'}]},
      {id:'als_bremse', label:'Bremse – Arbeitsluftspalt (nach Herstellervorgabe)', fields:[{type:'status'},{type:'measurement',label:'ALS',unit:'mm'},{type:'note'}]},
      {id:'oeldichtheit', label:'Dichtungen / Öldichtheit', fields:[{type:'status'},{type:'note'}]},
      {id:'hubseil_ablegereife', label:'Hubseil – Ablegereife (ISO 4309) erfüllt?', fields:[{type:'yesno'},{type:'note'}]},
      {id:'seiltrommel_rillung', label:'Seiltrommel – Seilrillung kontrollieren', fields:[{type:'status'},{type:'note'}]},
      {id:'seiltrommel_lagerung', label:'Seiltrommel – Lagerung nachschmieren', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_kopftraverse', label:'Seilumlenkrollen – Kopftraverse (Einlauftiefe prüfen, nachschmieren)', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_kopftraverse_vorne', label:'Seilumlenkrollen – Kopftraverse vorne (Einlauftiefe prüfen, nachschmieren)', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_hubrahmen', label:'Seilumlenkrollen – Hubrahmen (Einlauftiefe prüfen, nachschmieren)', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_weitere', label:'Weitere Umlenkpunkte (sofern vorhanden)', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'energiekette', label:'Energiekette/Schleifleitung – Beschädigungen kontrollieren', fields:[{type:'status'},{type:'note'}]},
      {id:'energiekette_uebergaenge', label:'Energiekette/Schleifleitung – Übergänge kontrollieren', fields:[{type:'status'},{type:'note'}]},
      {id:'energiekette_festpunkte', label:'Energiekette/Schleifleitung – Festpunkte Festsitz prüfen', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'tisch_kette_antrieb', title:'Teleskoptisch / Kettensystem / Antrieb', items:[
      {id:'oberteilauflage', label:'Oberteilauflage', fields:[{type:'status'},{type:'note'}]},
      {id:'kurvenrollen', label:'Kurvenrollen', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'schleifleisten', label:'Schleifleisten (einstellen falls nötig)', fields:[{type:'status'},{type:'note'}]},
      {id:'zahnstange', label:'Zahnstange / Rollen / Gleitleisten', fields:[{type:'status'},{type:'note'}]},
      {id:'stuetzrollen', label:'Stützrollen', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'getriebe', label:'Getriebe', fields:[{type:'status'},{type:'note'}]},
      {id:'ketten', label:'Ketten – nachspannen & schmieren', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'kettenspanner', label:'Kettenspanner', fields:[{type:'status'},{type:'note'}]},
      {id:'umlenkrollen_ketten', label:'Umlenkrollen / Kettenräder', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'kupplung', label:'Kupplung', fields:[{type:'status'},{type:'note'}]},
      {id:'gelenkwelle', label:'Gelenkwelle', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'elektrik', title:'Elektrik / Steuerung', items:[
      {id:'schaltschrank', label:'Schaltschrank sauber, dicht, Beschriftung', fields:[{type:'status'},{type:'note'}]},
      {id:'kabelfuehrung', label:'Kabelführung / Schleppkette / Übergänge', fields:[{type:'status'},{type:'note'}]},
      {id:'endschalter', label:'Endschalter / Initiatoren / Verkabelung', fields:[{type:'status'},{type:'note'}]},
      {id:'antriebsregler', label:'Antriebsregler / Parametrierung', fields:[{type:'status'},{type:'note'}]},
      {id:'not_halt', label:'Not-Halt / Sicherheitskette / Verriegelung', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'wiederkehrende_pruefung', title:'Wiederkehrende Prüfung (Sicherheit)', items:[
      {id:'notauskette', label:'Not-Aus-Kette inkl. Verriegelungen – Funktionsprüfung', fields:[{type:'status'},{type:'note'}]},
      {id:'endpositionen', label:'Endpositionen Wartung/Semiautomatik anfahren', fields:[{type:'status'},{type:'note'}]},
      {id:'bremsweg', label:'Bremsweg (ohne Last, niedrige Geschwindigkeit)', fields:[{type:'status'},{type:'note'}]},
      {id:'fangsystem', label:'Fangsystem / Geschwindigkeitsbegrenzer / Gestänge', fields:[{type:'status'},{type:'note'}]},
      {id:'lastmesseinheit', label:'Lastmesseinheit (Über-/Unterlast) – Test', fields:[{type:'status'},{type:'note'}]},
      {id:'sensorik', label:'Sicherheitsrelevante Sensorik / Lichtschranken', fields:[{type:'status'},{type:'note'}]},
      {id:'pruefbuch', label:'Prüfbuch vorhanden und Eintrag vorgenommen', fields:[{type:'status'},{type:'note'}]},
      {id:'bedenken', label:'Bedenken gegen weiteren Betrieb', fields:[{type:'yesno'}]}
    ]},
    { id:'maengelliste', title:'Mängelliste', items:[
      {id:'maengel', label:'Mängel / Beanstandungen (aus Bemerkungen zusammengefasst)', fields:[{type:'note'}]},
      {id:'schmierstoffe', label:'Wurden die Schmierstoffe zur Verfügung gestellt?', fields:[{type:'yesno'}]}
    ]}
  ];

  const PROTOCOLS = {
    rbg:{ name:'Regalbediengerät', specs:[
      {key:'mast',label:'Mast',type:'select',options:['Ein-Mast','Zwei-Mast']},
      {key:'teleskoptisch',label:'Teleskoptisch',type:'select',options:['einfach','doppelt']},
      {key:'nutzlast',label:'Nutzlast (kg)',type:'number'}
    ], sections: PROTOCOL_SECTIONS_RBG },
    ft:{ name:'Fördertechnik', specs:[
      {key:'system',label:'System',type:'select',options:['Rollenbahn','Gurtförderer','Kettenförderer','Heber','Drehtisch']},
      {key:'antrieb',label:'Antrieb',type:'select',options:['Motor/Getriebe','Direktantrieb']},
      {key:'spurbreite',label:'Spurbreite (mm)',type:'number'},
    ], sections:[
      {id:'ft1',title:'Antriebsstation',items:[{id:'ft_mg',label:'Motor/Getriebe',fields:[{type:'status'},{type:'note'}]},{id:'ft_sp',label:'Spannung/Kettenspanner',fields:[{type:'status'},{type:'lubricated'},{type:'note'}]}]},
      {id:'ft2',title:'Förderstrecke',items:[{id:'ft_rbk',label:'Rollen/Bänder/Ketten',fields:[{type:'status'},{type:'note'}]},{id:'ft_lsw',label:'Sensorik/Lichtschranken',fields:[{type:'status'},{type:'note'}]}]},
      {id:'ft3',title:'Sicherheit',items:[{id:'ft_notaus',label:'Not-Aus/Verriegelungen',fields:[{type:'status'},{type:'note'}]},{id:'ft_bed',label:'Bedenken gegen Betrieb',fields:[{type:'yesno'}]}]},
      {id:'ft4',title:'Mängelliste',items:[{id:'ft_m',label:'Mängel (Freitext)',fields:[{type:'note'}]},{id:'ft_schm',label:'Schmierstoffe bereitgestellt?',fields:[{type:'yesno'}]}]},
    ]},
    other:{ name:'Andere Anlage', specs:[
      {key:'beschreibung',label:'Kurzbeschreibung',type:'text'},
      {key:'hersteller',label:'Hersteller (optional)',type:'text'}
    ], sections:[
      {id:'allg',title:'Allgemein',items:[{id:'all_bef',label:'Befestigungen',fields:[{type:'status'},{type:'note'}]},{id:'all_sens',label:'Sensorik',fields:[{type:'status'},{type:'note'}]}]},
      {id:'sich',title:'Sicherheit',items:[{id:'all_not',label:'Not-Aus',fields:[{type:'status'},{type:'note'}]}]},
      {id:'mgl',title:'Mängelliste',items:[{id:'all_m',label:'Mängel (Freitext)',fields:[{type:'note'}]}]},
    ]},
  };

  const LS_USER='sc_user',LS_DRAFTS='sc_drafts',LS_PROJECTS='sc_projects',LS_SEC='sc_sec';
  const $=(s,e=document)=>e.querySelector(s), $$=(s,e=document)=>Array.from(e.querySelectorAll(s));
  const pad=n=>String(n).padStart(2,'0');
  const toDDMMYYYY=d=>pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear();
  function normalizeDateInput(s){ if(!s) return null; s=String(s).trim().replace(/[.\\-]/g,'/'); const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(iso) return iso[3]+'/'+iso[2]+'/'+iso[1]; const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m?pad(+m[1])+'/'+pad(+m[2])+'/'+m[3]:null;}
  const validDate=s=>!!normalizeDateInput(s);
  const lsGet=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch(_){return f}};
  const lsSet=(k,v)=>localStorage.setItem(k,JSON.stringify(v));
  const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
  const now=()=>new Date().toISOString();
  function toast(msg){const t=document.createElement('div');t.textContent=msg;Object.assign(t.style,{position:'fixed',bottom:'20px',left:'50%',transform:'translateX(-50%)',background:'#1f2a34',color:'#fff',padding:'8px 12px',borderRadius:'8px',zIndex:'9999',fontSize:'13px'});document.body.appendChild(t);setTimeout(()=>t.remove(),1400)}

  let STATE={user:null,header:{},specs:{},protocolType:null,jobType:null,items:{},signatures:{sig1:{img:null,active:false},sig2:{img:null,active:false}},datum_ddmmyyyy:null,page:'start',currentDraftId:null,dirty:false,accUnlocked:false};

  function setTitle(t,sub=''){ $('#appTitle').textContent=t||'Service Check'; $('#subtitle').textContent=sub?('· '+sub):''; }
  function navigate(page){ if(STATE.page==='protocol' && STATE.dirty){ openLeaveModal(()=>{saveDraftSnapshot(null);STATE.dirty=false;navigate(page);closeLeaveModal()},()=>{STATE.dirty=false;closeLeaveModal();navigate(page)}); return; } STATE.page=page; render(); }
  function render(){
    const root=$('#content'); root.innerHTML='';
    $('#backBtn').style.display=(STATE.page==='start'||STATE.page==='home')?'none':'inline-flex';
    $('#settingsBtn').style.display=(['protocol','home','specs','projects','drafts','accounting','project'].includes(STATE.page))?'inline-flex':'none';
    if(STATE.page==='start') return renderStart(root);
    if(STATE.page==='auth') return renderAuth(root);
    if(STATE.page==='home') return renderHome(root);
    if(STATE.page==='projects') return renderProjects(root);

          if(f.type==='lubricated'){ const d=document.createElement('div'); d.className='input'; d.style.maxWidth='200px'; d.innerHTML='<label></label><label style="display:flex;gap:6px;align-items:center"><input type="checkbox"> geschmiert</label>'; const cb=d.querySelector('input[type="checkbox"]'); cb.checked=!!STATE.items[item.id]?.geschmiert; cb.onchange=()=>{ STATE.items[item.id]=STATE.items[item.id]||{}; STATE.items[item.id].geschmiert=cb.checked; autosave(); }; row.appendChild(d); }
        });

        const pwrap=document.createElement('div'); pwrap.className='input photo-block'; pwrap.style.maxWidth='260px'; pwrap.innerHTML='<label>Foto (optional)</label><input type="file" accept="image/*;capture=camera"><img>';
        const inp=pwrap.querySelector('input'); const img=pwrap.querySelector('img');
        if(STATE.items[item.id]?.photo){img.src=STATE.items[item.id].photo; pwrap.classList.add('has-photo');}
        inp.onchange=async()=>{ const f=inp.files?.[0]; if(!f) return; const b64=await fileToDataURLScaled(f,1600,.75); STATE.items[item.id]=STATE.items[item.id]||{}; STATE.items[item.id].photo=b64; img.src=b64; pwrap.classList.add('has-photo'); autosave(); };
        row.appendChild(pwrap);

        block.append(label,row); det.appendChild(block);
      });

      card.appendChild(det); container.appendChild(card);
    });
  }

  function updateStatusTag(id, k){
    const tag = document.getElementById('st_'+id);
    if(!tag) return;
    tag.style.display = k ? 'inline-block' : 'none';
    tag.classList.remove('status-ok','status-nv','status-nok');
    if(k==='io'){ tag.textContent='i.O.'; tag.classList.add('status-ok'); }
    else if(k==='nio'){ tag.textContent='n.i.O.'; tag.classList.add('status-nok'); }
    else if(k==='nv'){ tag.textContent='n.v.'; tag.classList.add('status-nv'); }
    else { tag.textContent=''; }
  }

  function signatureBlock(label,key){
    const wrap=document.createElement('div'); wrap.className='input sig-pad';
    const header=document.createElement('div'); header.className='sig-header';
    const lab=document.createElement('label'); lab.textContent='Unterschrift '+label;
    const right=document.createElement('div'); right.className='sig-right';
    const badge=document.createElement('span'); badge.className='sig-badge'; right.appendChild(badge);
    const tgl=document.createElement('span'); tgl.className='sig-toggle'; right.appendChild(tgl);
    header.append(lab,right);

    const cv=document.createElement('canvas'); cv.className='sig-canvas';
    const tools=document.createElement('div'); tools.className='sig-tools';
    const clr=document.createElement('button'); clr.className='ghost'; clr.textContent='Löschen'; tools.appendChild(clr);

    wrap.append(header,cv,tools);
    setTimeout(()=>initPad(cv,clr,key,wrap,tgl,badge),0);
    return wrap;
  }
  function initPad(canvas,clearBtn,key,wrap,tgl,badge){
    const ctx=canvas.getContext('2d');
    function resize(){ const r=canvas.getBoundingClientRect(); const ratio=Math.max(window.devicePixelRatio||1,1); canvas.width=r.width*ratio; canvas.height=r.height*ratio; ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineWidth=2; ctx.lineCap='round'; const s=(STATE.signatures||{})[key]||{img:null,active:false}; if(s.img){const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=s.img;} }
    let draw=false,lastX=0,lastY=0; const get=(e)=>{const b=canvas.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-b.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-b.top; return {x,y}};
    function start(e){ if(!(STATE.signatures||{})[key]?.active) return; draw=true; const p=get(e); lastX=p.x; lastY=p.y; }
    function move(e){ if(!draw) return; const p=get(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
    function end(){ if(!draw) return; draw=false; sigSet(key,{img:canvas.toDataURL('image/png')}); }
    clearBtn.onclick=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); sigSet(key,{img:null}); };

    function updateToggleUI(){
      const s=(STATE.signatures||{})[key]||{img:null,active:false};
      const act = !!s.active;
      tgl.textContent = act ? 'Aktiv' : 'Inaktiv';
      badge.textContent = act ? 'beschreibbar' : 'gesperrt';
      wrap.classList.toggle('sig-disabled', !act);
    }
    tgl.onclick=()=>{ const cur=(STATE.signatures||{})[key]?.active; sigSet(key,{active:!cur}); updateToggleUI(); };

    window.addEventListener('resize',resize); resize();
    updateToggleUI();

    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    canvas.addEventListener('touchstart',(e)=>{start(e);e.preventDefault()},{passive:false});
    canvas.addEventListener('touchmove',(e)=>{move(e);e.preventDefault()},{passive:false});
    canvas.addEventListener('touchend',end);
  }
  function sigSet(key, patch){
    STATE.signatures = STATE.signatures || {};
    const cur = (STATE.signatures||{})[key] || {img:null,active:false};
    STATE.signatures[key] = {img: ('img' in patch ? patch.img : cur.img), active: ('active' in patch ? patch.active : cur.active)};
    autosave();
  }

  function listDrafts(){return lsGet(LS_DRAFTS,[])}
  function saveDraftSnapshot(projectId){
    const drafts=listDrafts(); const idx=drafts.findIndex(d=>d.id===STATE.currentDraftId);
    const data={id:idx>=0?drafts[idx].id:uid(),projectId:projectId??(idx>=0?drafts[idx].projectId:null),title:buildDraftTitle(),protocolType:STATE.protocolType,header:STATE.header,specs:STATE.specs,items:STATE.items,signatures:STATE.signatures,datum_ddmmyyyy:STATE.datum_ddmmyyyy||STATE.header.datum,updatedAt:now()};
    if(idx>=0) drafts[idx]=data; else drafts.unshift(data);
    lsSet(LS_DRAFTS,drafts); STATE.currentDraftId=data.id; STATE.dirty=false; toast('In Entwürfe gespeichert.');
    return data.id;
  }
  function deleteDraft(id){ lsSet(LS_DRAFTS, listDrafts().filter(d=>d.id!==id)); }
  function listProjects(){return lsGet(LS_PROJECTS,[])}
  function saveProject(p){ const arr=listProjects(); if(!p.id){p.id=uid(); p.createdAt=now();} const i=arr.findIndex(x=>x.id===p.id); if(i>=0)arr[i]=p; else arr.unshift(p); lsSet(LS_PROJECTS,arr); if(!localStorage.getItem('sc_times:'+p.id)) lsSet('sc_times:'+p.id,[]); return p.id; }
  function deleteProject(id){ lsSet(LS_PROJECTS, listProjects().filter(x=>x.id!==id)); }
  function listTimes(pid){ return lsGet('sc_times:'+pid,[]) }
  function addTime(pid,t){ const arr=listTimes(pid); t.id=uid(); t.createdAt=now(); arr.unshift(t); lsSet('sc_times:'+pid,arr); }

  function openSettings(){
    const sec=lsGet(LS_SEC,{}); $('#accPin').value=sec.accPin||'';
    $('#settingsModal').classList.add('open'); $('#settingsModal').setAttribute('aria-hidden','false');
    $('#saveAccPin').onclick=()=>{ const v=String($('#accPin').value||'').trim(); if(v && v.length!==4){alert('Bitte genau 4 Ziffern.');return;} const s=lsGet(LS_SEC,{}); s.accPin=v||undefined; lsSet(LS_SEC,s); toast(v?'PIN gesetzt.':'PIN entfernt.'); };
    $('#btnLogout').onclick=()=>{ localStorage.removeItem(LS_USER); STATE.user=null; toast('Abgemeldet.'); navigate('auth'); };
    $('#btnLogin').onclick=()=>{ navigate('auth'); };
    $('#settingsSave').onclick=closeSettings;
  }
  function closeSettings(){ $('#settingsModal').classList.remove('open'); $('#settingsModal').setAttribute('aria-hidden','true'); }

  function openSaveInModal(){
    const body=$('#saveInBody'); body.innerHTML='';
    const projs=listProjects();
    const sel=document.createElement('select'); sel.innerHTML='<option value="">–</option>'+projs.map(p=>`<option value="${p.id}">${p.projektnummer||''} · ${p.projekt||''}</option>`).join('');
    const wrap=document.createElement('div'); wrap.className='row';
    const a=document.createElement('div'); a.className='input'; a.innerHTML='<label>Projektordner</label>'; a.appendChild(sel);
    const b=document.createElement('div'); b.className='input'; b.innerHTML='<label>Neues Projekt (optional)</label><input id="newPn" placeholder="Projektnummer"><input id="newPj" placeholder="Projektname"><input id="newBet" placeholder="Betreiber"><input id="newBj" placeholder="Baujahr">';
    wrap.append(a,b); body.appendChild(wrap);
    $('#saveInModal').classList.add('open'); $('#saveInModal').setAttribute('aria-hidden','false');
    $('#saveInConfirm').onclick=()=>{ let pid=sel.value||null; if(!pid){ const pn=$('#newPn').value.trim(), pj=$('#newPj').value.trim(); if(pn&&pj){ pid=saveProject({projektnummer:pn,projekt:pj,betreiber:$('#newBet').value.trim(),baujahr:$('#newBj').value.trim()}); toast('Projektordner erstellt.'); } } saveDraftSnapshot(pid); closeSaveIn(); };
    $('#saveInCancel').onclick=closeSaveIn; $('#closeSaveIn').onclick=closeSaveIn;
  }
  function closeSaveIn(){ $('#saveInModal').classList.remove('open'); $('#saveInModal').setAttribute('aria-hidden','true'); }

  function openLeaveModal(onYes,onNo){ $('#leaveModal').classList.add('open'); $('#leaveModal').setAttribute('aria-hidden','false'); $('#leaveYes').onclick=onYes||(()=>{}); $('#leaveNo').onclick=onNo||(()=>{}); }
  function closeLeaveModal(){ $('#leaveModal').classList.remove('open'); $('#leaveModal').setAttribute('aria-hidden','true'); }

  function validateRequiredHeadersOnly(){
    for(const k of REQUIRED_HEADER_KEYS){ const v=STATE.header[k]; if(!v||!String(v).trim()) return false; if(k==='datum'&&!validDate(v)) return false; }
    return true;
  }
  function togglePrintButton(){ const btn=$('#print'); if(btn) btn.disabled=!validateRequiredHeadersOnly(); }

  function openAccModal(){ $('#accModal').classList.add('open'); $('#accModal').setAttribute('aria-hidden','false'); }
  function closeAccModal(){ $('#accModal').classList.remove('open'); $('#accModal').setAttribute('aria-hidden','true'); }
  function unlockAccounting(){
    const pin = ($('#accLoginPin').value||'').trim();
    const sec = lsGet(LS_SEC,{});
    if(!sec.accPin){ alert('Bitte zuerst in den Einstellungen eine PIN setzen.'); return; }
    if(pin!==sec.accPin){ alert('Falsche PIN.'); return; }
    STATE.accUnlocked = true;
    closeAccModal();
    navigate('accounting');
  }
  function renderAccounting(root){
    setTitle('Service Check','Buchhaltung');
    const wrap=document.createElement('section'); wrap.className='card bookOnly';
    if(!STATE.accUnlocked){
      wrap.innerHTML='<div class="note">Gesperrt. Bitte mit PIN entsperren.</div>';
      root.appendChild(wrap); return;
    }
    wrap.innerHTML='<h2 style="margin:6px 0 12px 0">Material & Leistungen</h2>';
    const row=document.createElement('div'); row.className='row';
    row.innerHTML=`
      <div class="input"><label>Bezeichnung</label><input id="acc_desc" placeholder="z.B. Lagerrolle, Arbeitszeit"></div>
      <div class="input"><label>Menge</label><input id="acc_qty" type="number" inputmode="decimal" placeholder="1"></div>
      <div class="input"><label>Einheit</label><input id="acc_unit" placeholder="Stk, Std, m, kg…"></div>
      <div class="input"><label>Einzelpreis (€)</label><input id="acc_price" type="number" inputmode="decimal" placeholder="0.00"></div>
    `;
    const add=document.createElement('button'); add.className='primary'; add.textContent='Hinzufügen';
    add.onclick=()=>{
      const d=$('#acc_desc').value.trim(); const q=parseFloat($('#acc_qty').value||'0'); const u=$('#acc_unit').value.trim(); const p=parseFloat($('#acc_price').value||'0');
      if(!d||!q||!p){ alert('Bitte Bezeichnung, Menge, Preis.'); return; }
      const arr=lsGet('sc_acc',[]); arr.unshift({id:uid(),desc:d,qty:q,unit:u,price:p,createdAt:now()}); lsSet('sc_acc',arr); toast('Hinzugefügt.'); render();
    };
    wrap.append(row,add); root.appendChild(wrap);

    const list=document.createElement('section'); list.className='card';
    const arr=lsGet('sc_acc',[]);
    if(!arr.length){ list.innerHTML='<div class="note">Noch keine Einträge.</div>'; root.appendChild(list); return; }
    const tbl=document.createElement('table'); tbl.className='table';
    tbl.innerHTML='<thead><tr><th>Bezeichnung</th><th>Menge</th><th>Einheit</th><th>Einzelpreis</th><th>Summe</th><th></th></tr></thead>';
    const tb=document.createElement('tbody');
    let total=0;
    arr.forEach(it=>{
      const sum = it.qty*it.price; total+=sum;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td>${it.desc}</td><td>${it.qty}</td><td>${it.unit||''}</td><td>${it.price.toFixed(2)}</td><td>${sum.toFixed(2)}</td><td><button class="ghost">Löschen</button></td>`;
      tr.querySelector('button').onclick=()=>{ const rest=arr.filter(x=>x.id!==it.id); lsSet('sc_acc',rest); render(); };
      tb.appendChild(tr);
    });
    tbl.appendChild(tb);
    const sumDiv=document.createElement('div'); sumDiv.style.marginTop='8px'; sumDiv.innerHTML = '<b>Gesamtsumme: ' + total.toFixed(2) + ' €</b>';
    const exp=document.createElement('button'); exp.className='ghost'; exp.textContent='CSV exportieren';
    exp.onclick=()=>{
      const headers=['Bezeichnung','Menge','Einheit','Einzelpreis','Summe'];
      const rows=arr.map(it=>[it.desc,it.qty,it.unit||'',it.price.toFixed(2),(it.qty*it.price).toFixed(2)]);
      downloadCSV('Buchhaltung.csv',headers,rows);
    };
    list.append(tbl, sumDiv, document.createElement('br'), exp);
    root.appendChild(list);
  }

  let saveTimer=null; function autosave(force){ if(force){doSave();return;} if(saveTimer) clearTimeout(saveTimer); saveTimer=setTimeout(doSave,300); STATE.dirty=true; }
  function doSave(){ localStorage.setItem(LS_USER, JSON.stringify(STATE.user||{})); const key='sc_autosave:'+ (STATE.protocolType||'default'); localStorage.setItem(key, JSON.stringify({header:STATE.header,specs:STATE.specs,items:STATE.items,signatures:STATE.signatures,datum_ddmmyyyy:STATE.datum_ddmmyyyy})); }
  function loadAutosaveFor(type){ try{ const raw=localStorage.getItem('sc_autosave:'+type); if(raw){ const o=JSON.parse(raw); STATE.header=o.header||{}; STATE.specs=o.specs||{}; STATE.items=o.items||{}; STATE.signatures=o.signatures||{sig1:{img:null,active:false},sig2:{img:null,active:false}}; STATE.datum_ddmmyyyy=o.datum_ddmmyyyy||toDDMMYYYY(new Date()); if(!STATE.header.datum) STATE.header.datum=STATE.datum_ddmmyyyy; } else { STATE.header={}; STATE.items={}; STATE.specs={}; STATE.signatures={sig1:{img:null,active:false},sig2:{img:null,active:false}}; STATE.datum_ddmmyyyy=toDDMMYYYY(new Date()); STATE.header.datum=STATE.datum_ddmmyyyy; } STATE.dirty=false; }catch(_){ } }
  function buildDraftTitle(){ const t=PROTOCOLS[STATE.protocolType]?.name||'Protokoll'; const p=STATE.header?.projektnummer?' · '+STATE.header.projektnummer:''; return `${t}${p} – ${STATE.header?.datum||STATE.datum_ddmmyyyy||toDDMMYYYY(new Date())}`; }
  function downloadCSV(name,headers,rows){ const csv=[headers.join(';')].concat(rows.map(r=>r.map(v=>String(v).replace(/;/g,',')).join(';'))).join('\n'); const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
  function downloadJSON(name,obj){ const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url); }
  function fileToDataURLScaled(file,maxSide=1600,q=0.75){return new Promise(res=>{const R=new FileReader();R.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height; if(w>h&&w>maxSide){h=Math.round(h*maxSide/w);w=maxSide}else if(h>maxSide){w=Math.round(w*maxSide/h);h=maxSide} const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q));};img.src=R.result;};R.readAsDataURL(file);});}
  function labelJob(k){ if(k==='wartung') return 'Wartung'; if(k==='wartung_uvv') return 'Wartung + UVV'; if(k==='elektro') return 'Elektro'; if(k==='leiterpruefung') return 'Leiterprüfung'; return null; }

  function aggregateNotesToMaengel(){
    const lines=[];
    function pushLine(label,note){ if(!note) return; const clean=String(note).trim(); if(!clean) return; lines.push('• '+label+': '+clean); }
    const lookupLabel={};
    const proto=PROTOCOLS[STATE.protocolType];
    proto.sections.forEach(sec=>sec.items.forEach(it=>{lookupLabel[it.id]=it.label;}));
    for(const id in STATE.items){
      if(id==='maengel') continue;
      const it=STATE.items[id];
      if(it && typeof it.note==='string' && it.note.trim()){
        pushLine(lookupLabel[id]||id, it.note);
        it.note='';
      }
    }
    const text=lines.join('\n');
    STATE.items['maengel']=STATE.items['maengel']||{};
    STATE.items['maengel'].note = (STATE.items['maengel'].note? (STATE.items['maengel'].note+'\n'):'') + text;
    autosave(true);
  }

  window.addEventListener('DOMContentLoaded',()=>{
    try{ STATE.user=lsGet(LS_USER,null)||null; }catch(_){}
    STATE.protocolType='rbg'; loadAutosaveFor('rbg');
    STATE.page = STATE.user ? 'home' : 'start';
    render();
    $('#backBtn').onclick=()=>{ if(STATE.page==='auth'){navigate('start');return;} if(STATE.page==='home'){navigate('start');return;} if(STATE.page==='specs'){navigate('home');return;} if(STATE.page==='protocol'){navigate('specs');return;} if(STATE.page==='projects'){navigate('home');return;} if(STATE.page==='project'){navigate('projects');return;} if(STATE.page==='drafts'){navigate('home');return;} if(STATE.page==='accounting'){navigate('home');return;} navigate('start'); };
    $('#settingsBtn').onclick=openSettings; $('#closeSettings').onclick=closeSettings; $('#settingsSave').onclick=()=>{closeSettings();togglePrintButton();};
    $('#accCancel').onclick=closeAccModal; $('#closeAcc').onclick=closeAccModal; $('#accUnlock').onclick=unlockAccounting;
  });
</script>
