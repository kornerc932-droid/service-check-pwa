<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Service Check Pro</title>
  <style>
    :root { 
      --bg: #f0f2f5; 
      --fg: #1c1e21; 
      --muted: #65676b; 
      --accent: #007bff; 
      --accent-dark: #0056b3;
      --card: #ffffff; 
      --line: #e4e6eb; 
      --ok: #28a745; 
      --warn: #dc3545; 
      --nv: #707b86;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --radius: 16px;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      margin: 0; padding: 0; 
      background: var(--bg); 
      color: var(--fg); 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      padding: 12px 20px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px;
    }

    .title { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 18px; font-weight: 700; margin: 0; letter-spacing: -0.5px; }
    .title small { color: var(--muted); font-weight: 500; font-size: 13px; }
    
    .container { 
      padding: 16px; max-width: 980px; margin: 0 auto; 
      padding-bottom: 100px;
    }

    .card { 
      background: var(--card); 
      border-radius: var(--radius); 
      padding: 16px; 
      margin-bottom: 16px; 
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.02);
    }

    .row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
    .input { flex: 1; min-width: 220px; display: flex; flex-direction: column; gap: 6px; }
    .input label { font-size: 13px; font-weight: 600; color: var(--muted); }
    .req label::after { content: " *"; color: var(--warn); }
    
    .input input, .input select, .input textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 12px;
      padding: 12px 14px; font-size: 16px; background: #f9fafb;
      transition: all 0.2s;
    }
    .input input:focus, .input textarea:focus, .input select:focus { 
      border-color: var(--accent); outline: none; background: #fff; box-shadow: 0 0 0 3px rgba(0,123,255,0.1); 
    }

    button.primary {
      background: var(--accent); color: white; border: none;
      padding: 14px 24px; border-radius: 12px; font-weight: 600;
      cursor: pointer; transition: transform 0.1s, background 0.2s; font-size: 16px;
    }
    button.primary:active { transform: scale(0.98); background: var(--accent-dark); }
    button.primary[disabled] { opacity: 0.5; cursor: not-allowed; }
    
    button.ghost {
      background: #fff; border: 1px solid var(--line); color: var(--fg);
      padding: 12px 16px; border-radius: 12px; font-weight: 500; cursor: pointer; font-size: 16px;
    }
    button.icon { padding: 8px 10px; font-size: 18px; display: inline-flex; align-items: center; justify-content: center; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    .tile {
      background: var(--card); border: 1px solid var(--line);
      padding: 16px; border-radius: var(--radius); text-align: left;
      transition: all 0.2s; cursor: pointer; display: flex; flex-direction: column; gap: 8px;
    }
    .tile:active { background: #f0f7ff; border-color: var(--accent); transform: scale(0.98); }

    .note { font-size: 12px; color: var(--muted); }
    .pill { border: 1px solid var(--line); border-radius: 999px; padding: 6px 10px; background: #f9fafb; font-size: 12px; display: inline-block; }
    .badge { display: flex; gap: 8px; flex-wrap: wrap; }
    
    .chip {
      appearance: none; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px;
      font-size: 14px; font-weight: 600; background: #fff; cursor: pointer; color: var(--muted);
    }
    .chip.active { box-shadow: 0 0 0 2px rgba(0,123,255,.15); }
    .chip.ok.active { background: #d4edda; border-color: var(--ok); color: #155724; }
    .chip.nok.active { background: #f8d7da; border-color: var(--warn); color: #721c24; }
    .chip.nv.active { background: #eef2f6; border-color: var(--nv); color: var(--nv); }

    .statusTag { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; margin-left: 8px; font-size: 12px; vertical-align: middle; }
    .status-ok { border-color: var(--ok); color: var(--ok); background: #d4edda; }
    .status-nok { border-color: var(--warn); color: var(--warn); background: #f8d7da; }
    .status-nv { border-color: var(--nv); color: var(--nv); background: #eef2f6; }

    .sig-pad { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; position: relative; background: #f9fafb; }
    .sig-canvas { width: 100%; height: 160px; background: #fff; border: 1px solid var(--line); border-radius: 8px; touch-action: none; }
    .sig-tools { display: flex; gap: 8px; margin-top: 8px; }
    .sig-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .sig-right { display: flex; align-items: center; gap: 8px; }
    .sig-toggle { font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 600; }
    .sig-disabled .sig-canvas { pointer-events: none; filter: grayscale(1); opacity: .5; }
    .sig-disabled .sig-tools button { pointer-events: none; opacity: .5; }
    .sig-badge { display: inline-block; border: 1px solid var(--line); border-radius: 6px; padding: 2px 8px; font-size: 12px; background: #fff; }

    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { border: 1px solid var(--line); padding: 10px; text-align: left; font-size: 14px; }
    .table th { background: #f9fafb; }

    .footer-actions { position: sticky; bottom: 0; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; z-index: 15; }
    .toggle { margin-left: 8px; font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 600; }
    .inactive { opacity: .5; }
    
    .photo-block img { max-width: 120px; border: 1px solid var(--line); border-radius: 8px; margin-top: 8px; display: none; }
    .photo-block.has-photo img { display: block; }

    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-top: 1px solid var(--line);
      display: flex; justify-content: space-around; padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      z-index: 1000;
    }
    .nav-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: var(--muted); cursor: pointer; padding: 4px 12px; border-radius: 8px; transition: 0.2s; }
    .nav-item.active { color: var(--accent); font-weight: 600; background: rgba(0,123,255,0.08); }
    .nav-icon { font-size: 22px; margin-bottom: 2px; }

    @media print {
      header, .bottom-nav, .footer-actions, .toggle, .chip, input[type="file"], .sig-toggle, .sig-badge, .startOnly, .authOnly, .homeOnly, .specsOnly, .projectsOnly, .bookOnly { display: none !important; }
      body { background: #fff; color: #000; }
      .container { max-width: none; margin: 0; padding: 0; }
      .card { break-inside: avoid; border: 1px solid #999; box-shadow: none; margin-bottom: 10px; padding: 10px; }
      .input input, .input textarea, .input select { border: 1px solid #999; background: #fff; }
      .photo-block:not(.has-photo) { display: none !important; }
      .inactive { display: none !important; }
      .sig-pad { border: 1px solid #000; background: #fff; }
      @page { size: A4 portrait; margin: 12mm; }
    }

    .modal { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); z-index: 2000; padding: 16px; backdrop-filter: blur(4px); }
    .modal.open { display: flex; animation: fadeIn 0.2s ease-out; }
    .modal-card { background: #ffffff; border: 1px solid var(--line); border-radius: var(--radius); width: 100%; max-width: 600px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); transform: translateY(0); animation: slideUp 0.3s ease-out; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(50px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    @media (max-width: 420px) {
      .row { flex-direction: column; gap: 8px; }
      .input { min-width: unset; }
    }
    
    /* Utility class for hiding bottom nav when deep in forms */
    .hide-nav .bottom-nav { display: none; }
    .hide-nav .container { padding-bottom: 80px; } /* Space for sticky footer instead of nav */
  </style>
</head>
<body>

  <header>
    <div class="title">
      <button class="ghost icon" id="backBtn" title="Zurück" style="border:none; background:transparent">⬅️</button>
      <div>
        <h1 id="appTitle">Service Check</h1>
        <small id="subtitle"></small>
      </div>
    </div>
    <div class="toolbar">
      <button class="ghost icon" id="settingsBtn" title="Einstellungen" style="border:none; background:transparent">⚙️</button>
    </div>
  </header>

  <main class="container" id="content"></main>

  <nav class="bottom-nav" id="bottomNav">
    <div class="nav-item" id="navHome">
      <span class="nav-icon">🏠</span><span>Home</span>
    </div>
    <div class="nav-item" id="navProjects">
      <span class="nav-icon">📁</span><span>Projekte</span>
    </div>
    <div class="nav-item" id="navDrafts">
      <span class="nav-icon">📝</span><span>Entwürfe</span>
    </div>
    <div class="nav-item" id="navAcc">
      <span class="nav-icon">📊</span><span>Finanzen</span>
    </div>
  </nav>

  <!-- Modals -->
  <div class="modal" id="settingsModal" aria-hidden="true">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <h2 style="margin:0;font-size:18px;">Einstellungen</h2>
        <button class="ghost icon" id="closeSettings" style="border:none">✖️</button>
      </div>
      <div class="row" style="margin-bottom:16px">
        <div class="input"><label>Buchhaltung-PIN (4-stellig)</label><input id="accPin" placeholder="****" type="password" inputmode="numeric" maxlength="4"></div>
        <div style="display:flex;align-items:flex-end;">
          <button class="ghost" id="saveAccPin" style="height:46px;">PIN setzen</button>
        </div>
      </div>
      <div class="row">
        <button class="ghost" id="btnLogin" style="flex:1">Anmelden</button>
        <button class="ghost" id="btnLogout" style="flex:1; color:var(--warn); border-color:var(--warn)">Abmelden</button>
      </div>
      <div class="modal-actions">
        <button class="primary" id="settingsSave">Fertig</button>
      </div>
    </div>
  </div>

  <div class="modal" id="saveInModal" aria-hidden="true">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0;font-size:18px;">Protokoll speichern in…</h2>
        <button class="ghost icon" id="closeSaveIn" style="border:none">✖️</button>
      </div>
      <div id="saveInBody"></div>
      <div class="modal-actions">
        <button class="ghost" id="saveInCancel">Abbrechen</button>
        <button class="primary" id="saveInConfirm">Speichern</button>
      </div>
    </div>
  </div>

  <div class="modal" id="leaveModal" aria-hidden="true">
    <div class="modal-card">
      <h2 style="margin:0 0 12px 0;font-size:18px;">Entwurf speichern?</h2>
      <div class="note" style="font-size:14px; margin-bottom:20px;">Du verlässt ein begonnenes Protokoll. Möchtest du deinen Fortschritt als Entwurf speichern?</div>
      <div class="modal-actions">
        <button class="ghost" id="leaveNo">Verwerfen</button>
        <button class="primary" id="leaveYes">Ja, speichern</button>
      </div>
    </div>
  </div>

  <div class="modal" id="accModal" aria-hidden="true">
    <div class="modal-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h2 style="margin:0;font-size:18px;">Buchhaltung entsperren</h2>
        <button class="ghost icon" id="closeAcc" style="border:none">✖️</button>
      </div>
      <div class="row" style="margin-bottom:16px">
        <div class="input"><label>PIN (4-stellig)</label><input id="accLoginPin" placeholder="****" type="password" inputmode="numeric" maxlength="4"></div>
      </div>
      <div class="note" style="margin-bottom:16px">Die PIN wird lokal gespeichert.</div>
      <div class="modal-actions">
        <button class="ghost" id="accCancel">Abbrechen</button>
        <button class="primary" id="accUnlock">Entsperren</button>
      </div>
    </div>
  </div>

<script>
  // --- KONSTANTEN & DATENSTRUKTUREN ---
  const REQUIRED_HEADER_KEYS = ['projektnummer','projekt','betreiber','datum'];
  const HEADER_FIELDS_MIN = [
    {key:'projektnummer',label:'Projektnummer',req:true},
    {key:'projekt',label:'Projekt',req:true},
    {key:'betreiber',label:'Betreiber',req:true},
    {key:'datum',label:'Datum (TT/MM/JJJJ)',req:true},
    {key:'baujahr',label:'Baujahr'},
    {key:'jobType',label:'Auftragsart',req:false}
  ];

  const PROTOCOL_SECTIONS_RBG = [
    { id:'gasse', title:'Gasse / Ausrüstung', items:[
      {id:'schleifleitung', label:'Schleifleitung / Stromabnehmer', fields:[{type:'status'},{type:'note'}]},
      {id:'fahrschiene', label:'Fahrschiene (Befestigung/Tragbild)', fields:[{type:'status'},{type:'note'}]},
      {id:'oberfuehrung', label:'Obere Führungsschiene (Befestigung, Verbindungen)', fields:[{type:'status'},{type:'note'}]},
      {id:'schiene_bef', label:'Schienenstoß / Verbinder (Befestigung)', fields:[{type:'status'},{type:'note'}]},
      {id:'puffer', label:'Puffer / Festanschläge (Befestigung)', fields:[{type:'status'},{type:'note'}]},
      {id:'anschlaege', label:'Anschläge / Notanschläge', fields:[{type:'status'},{type:'note'}]},
      {id:'leitern', label:'Steigleitern / Podeste / Geländer', fields:[{type:'status'},{type:'note'}]},
      {id:'kennzeichnung', label:'Kennzeichnungen / Warnhinweise', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'fahrwagen', title:'Fahrwagen / Führungsrollen / Laufräder', items:[
      {id:'fw_befestigung', label:'Fahrwerk – Befestigung', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_motor', label:'Fahrwerk – Motor', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_getriebe', label:'Fahrwerk – Getriebe', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_drehmomentstuetze', label:'Fahrwerk – Drehmomentstütze', fields:[{type:'status'},{type:'note'}]},
      {id:'fw_kupplung', label:'Fahrwerk – Kupplung', fields:[{type:'status'},{type:'note'}]},
      {id:'fuehrungsrollen_fahrwagen', label:'Führungsrollen Fahrwagen', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'lr_angetrieben', label:'Laufrad angetrieben', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'note'}]},
      {id:'lr_nichtangetrieben', label:'Laufrad nicht angetrieben', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'note'}]},
      {id:'achsabdeckung', label:'Abdeckungen / Schutz', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'hubwerk', title:'Hubwerk', items:[
      {id:'befestigungen_allg', label:'Befestigungen (allg.)', fields:[{type:'status'},{type:'note'}]},
      {id:'als_bremse', label:'Bremse – Arbeitsluftspalt', fields:[{type:'status'},{type:'measurement',label:'ALS',unit:'mm'},{type:'note'}]},
      {id:'oeldichtheit', label:'Dichtungen / Öldichtheit', fields:[{type:'status'},{type:'note'}]},
      {id:'hubseil_ablegereife', label:'Hubseil – Ablegereife (ISO 4309)', fields:[{type:'yesno'},{type:'note'}]},
      {id:'seiltrommel_rillung', label:'Seiltrommel – Seilrillung', fields:[{type:'status'},{type:'note'}]},
      {id:'seiltrommel_lagerung', label:'Seiltrommel – Lagerung nachschmieren', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_kopftraverse', label:'Seilumlenkrollen – Kopftraverse', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_kopftraverse_vorne', label:'Seilumlenkrollen – Kopftraverse vorne', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_hubrahmen', label:'Seilumlenkrollen – Hubrahmen', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'uml_weitere', label:'Weitere Umlenkpunkte', fields:[{type:'status'},{type:'measurement',label:'Einlauftiefe',unit:'mm'},{type:'lubricated'},{type:'note'}]},
      {id:'energiekette', label:'Energiekette/Schleifleitung – Beschädigungen', fields:[{type:'status'},{type:'note'}]},
      {id:'energiekette_uebergaenge', label:'Energiekette/Schleifleitung – Übergänge', fields:[{type:'status'},{type:'note'}]},
      {id:'energiekette_festpunkte', label:'Energiekette/Schleifleitung – Festpunkte', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'tisch_kette_antrieb', title:'Teleskoptisch / Kettensystem / Antrieb', items:[
      {id:'oberteilauflage', label:'Oberteilauflage', fields:[{type:'status'},{type:'note'}]},
      {id:'kurvenrollen', label:'Kurvenrollen', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'schleifleisten', label:'Schleifleisten (einstellen falls nötig)', fields:[{type:'status'},{type:'note'}]},
      {id:'zahnstange', label:'Zahnstange / Rollen / Gleitleisten', fields:[{type:'status'},{type:'note'}]},
      {id:'stuetzrollen', label:'Stützrollen', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'getriebe', label:'Getriebe', fields:[{type:'status'},{type:'note'}]},
      {id:'ketten', label:'Ketten – nachspannen & schmieren', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'kettenspanner', label:'Kettenspanner', fields:[{type:'status'},{type:'note'}]},
      {id:'umlenkrollen_ketten', label:'Umlenkrollen / Kettenräder', fields:[{type:'status'},{type:'lubricated'},{type:'note'}]},
      {id:'kupplung', label:'Kupplung', fields:[{type:'status'},{type:'note'}]},
      {id:'gelenkwelle', label:'Gelenkwelle', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'elektrik', title:'Elektrik / Steuerung', items:[
      {id:'schaltschrank', label:'Schaltschrank sauber, dicht, Beschriftung', fields:[{type:'status'},{type:'note'}]},
      {id:'kabelfuehrung', label:'Kabelführung / Schleppkette / Übergänge', fields:[{type:'status'},{type:'note'}]},
      {id:'endschalter', label:'Endschalter / Initiatoren / Verkabelung', fields:[{type:'status'},{type:'note'}]},
      {id:'antriebsregler', label:'Antriebsregler / Parametrierung', fields:[{type:'status'},{type:'note'}]},
      {id:'not_halt', label:'Not-Halt / Sicherheitskette / Verriegelung', fields:[{type:'status'},{type:'note'}]}
    ]},
    { id:'wiederkehrende_pruefung', title:'Wiederkehrende Prüfung (Sicherheit)', items:[
      {id:'notauskette', label:'Not-Aus-Kette inkl. Verriegelungen', fields:[{type:'status'},{type:'note'}]},
      {id:'endpositionen', label:'Endpositionen Wartung/Semiautomatik anfahren', fields:[{type:'status'},{type:'note'}]},
      {id:'bremsweg', label:'Bremsweg', fields:[{type:'status'},{type:'note'}]},
      {id:'fangsystem', label:'Fangsystem / Geschwindigkeitsbegrenzer', fields:[{type:'status'},{type:'note'}]},
      {id:'lastmesseinheit', label:'Lastmesseinheit (Über-/Unterlast) – Test', fields:[{type:'status'},{type:'note'}]},
      {id:'sensorik', label:'Sicherheitsrelevante Sensorik / Lichtschranken', fields:[{type:'status'},{type:'note'}]},
      {id:'pruefbuch', label:'Prüfbuch vorhanden und Eintrag vorgenommen', fields:[{type:'status'},{type:'note'}]},
      {id:'bedenken', label:'Bedenken gegen weiteren Betrieb', fields:[{type:'yesno'}]}
    ]},
    { id:'maengelliste', title:'Mängelliste', items:[
      {id:'maengel', label:'Mängel / Beanstandungen (zusammengefasst)', fields:[{type:'note'}]},
      {id:'schmierstoffe', label:'Wurden die Schmierstoffe zur Verfügung gestellt?', fields:[{type:'yesno'}]}
    ]}
  ];

  const PROTOCOLS = {
    rbg:{ name:'Regalbediengerät', specs:[
      {key:'mast',label:'Mast',type:'select',options:['Ein-Mast','Zwei-Mast']},
      {key:'teleskoptisch',label:'Teleskoptisch',type:'select',options:['einfach','doppelt']},
      {key:'nutzlast',label:'Nutzlast (kg)',type:'number'}
    ], sections: PROTOCOL_SECTIONS_RBG },
    ft:{ name:'Fördertechnik', specs:[
      {key:'system',label:'System',type:'select',options:['Rollenbahn','Gurtförderer','Kettenförderer','Heber','Drehtisch']},
      {key:'antrieb',label:'Antrieb',type:'select',options:['Motor/Getriebe','Direktantrieb']},
      {key:'spurbreite',label:'Spurbreite (mm)',type:'number'},
    ], sections:[
      {id:'ft1',title:'Antriebsstation',items:[{id:'ft_mg',label:'Motor/Getriebe',fields:[{type:'status'},{type:'note'}]},{id:'ft_sp',label:'Spannung/Kettenspanner',fields:[{type:'status'},{type:'lubricated'},{type:'note'}]}]},

  function normalizeDateInput(s){ if(!s) return null; s=String(s).trim().replace(/[.\\-]/g,'/'); const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(iso) return iso[3]+'/'+iso[2]+'/'+iso[1]; const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m?pad(+m[1])+'/'+pad(+m[2])+'/'+m[3]:null;}
  const validDate=s=>!!normalizeDateInput(s);

  function initPad(canvas,clearBtn,key,wrap,tgl,badge){
    const ctx=canvas.getContext('2d');
    function resize(){ const r=canvas.getBoundingClientRect(); const ratio=Math.max(window.devicePixelRatio||1,1); canvas.width=r.width*ratio; canvas.height=r.height*ratio; ctx.setTransform(ratio,0,0,ratio,0,0); ctx.lineWidth=2; ctx.lineCap='round'; const s=(STATE.signatures||{})[key]||{img:null,active:false}; if(s.img){const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,r.width,r.height); img.src=s.img;} }
    let draw=false,lastX=0,lastY=0; const get=(e)=>{const b=canvas.getBoundingClientRect(); const x=(e.touches?e.touches[0].clientX:e.clientX)-b.left; const y=(e.touches?e.touches[0].clientY:e.clientY)-b.top; return {x,y}};
    function start(e){ if(!(STATE.signatures||{})[key]?.active) return; draw=true; const p=get(e); lastX=p.x; lastY=p.y; }
    function move(e){ if(!draw) return; const p=get(e); ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y; }
    function end(){ if(!draw) return; draw=false; sigSet(key,{img:canvas.toDataURL('image/png')}); }
    clearBtn.onclick=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); sigSet(key,{img:null}); };

    function updateToggleUI(){
      const s=(STATE.signatures||{})[key]||{img:null,active:false};
      const act = !!s.active;
      tgl.textContent = act ? 'Aktiv' : 'Inaktiv';
      badge.textContent = act ? 'beschreibbar' : 'gesperrt';
      wrap.classList.toggle('sig-disabled', !act);
    }
    tgl.onclick=()=>{ const cur=(STATE.signatures||{})[key]?.active; sigSet(key,{active:!cur}); updateToggleUI(); };

    window.addEventListener('resize',resize); resize();
    updateToggleUI();

    canvas.addEventListener('mousedown',start); canvas.addEventListener('mousemove',move); window.addEventListener('mouseup',end);
    canvas.addEventListener('touchstart',(e)=>{start(e);e.preventDefault()},{passive:false});
    canvas.addEventListener('touchmove',(e)=>{move(e);e.preventDefault()},{passive:false});
    canvas.addEventListener('touchend',end);
  }
  function sigSet(key, patch){
    STATE.signatures = STATE.signatures || {};
    const cur = (STATE.signatures||{})[key] || {img:null,active:false};
    STATE.signatures[key] = {img: ('img' in patch ? patch.img : cur.img), active: ('active' in patch ? patch.active : cur.active)};
    autosave();
  }

  function fileToDataURLScaled(file,maxSide=1600,q=0.75){return new Promise(res=>{const R=new FileReader();R.onload=()=>{const img=new Image();img.onload=()=>{let w=img.width,h=img.height; if(w>h&&w>maxSide){h=Math.round(h*maxSide/w);w=maxSide}else if(h>maxSide){w=Math.round(w*maxSide/h);h=maxSide} const cv=document.createElement('canvas');cv.width=w;cv.height=h;cv.getContext('2d').drawImage(img,0,0,w,h);res(cv.toDataURL('image/jpeg',q));};img.src=R.result;};R.readAsDataURL(file);});}

  function aggregateNotesToMaengel(){
    const lines=[];
    function pushLine(label,note){ if(!note) return; const clean=String(note).trim(); if(!clean) return; lines.push('• '+label+': '+clean); }
    const lookupLabel={};
    const proto=PROTOCOLS[STATE.protocolType];
    proto.sections.forEach(sec=>sec.items.forEach(it=>{lookupLabel[it.id]=it.label;}));
    for(const id in STATE.items){
      if(id==='maengel') continue;
      const it=STATE.items[id];
      if(it && typeof it.note==='string' && it.note.trim()){
        pushLine(lookupLabel[id]||id, it.note);
        it.note='';
      }
    }
    const text=lines.join('\n');
    STATE.items['maengel']=STATE.items['maengel']||{};
    STATE.items['maengel'].note = (STATE.items['maengel'].note? (STATE.items['maengel'].note+'\n'):'') + text;
    autosave(true);
  }

  window.addEventListener('DOMContentLoaded',()=>{
    try{ STATE.user=lsGet(LS_USER,null)||null; }catch(_){}
    
    // Bottom Navigation Wiring
    $('#navHome').onclick=()=>{ if(STATE.user) navigate('home'); else navigate('start'); };
    $('#navProjects').onclick=()=>navigate('projects');
    $('#navDrafts').onclick=()=>navigate('drafts');
    $('#navAcc').onclick=()=>openAccModal();

    STATE.protocolType='rbg'; loadAutosaveFor('rbg');
    STATE.page = STATE.user ? 'home' : 'start';
    render();

    $('#backBtn').onclick=()=>{ 
      if(STATE.page==='auth'){navigate('start');return;} 
      if(STATE.page==='home'){navigate('start');return;} 
      if(STATE.page==='specs'){navigate('home');return;} 
      if(STATE.page==='protocol'){navigate('specs');return;} 
      if(STATE.page==='projects'){navigate('home');return;} 
      if(STATE.page==='project'){navigate('projects');return;} 
      if(STATE.page==='drafts'){navigate('home');return;} 
      if(STATE.page==='accounting'){navigate('home');return;} 
      navigate('start'); 
    };
    $('#settingsBtn').onclick=openSettings; 
    $('#closeSettings').onclick=closeSettings; 
    $('#accCancel').onclick=closeAccModal; 
    $('#closeAcc').onclick=closeAccModal; 
    $('#accUnlock').onclick=unlockAccounting;
  });
</script>
</body>
</html>
